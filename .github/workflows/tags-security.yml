name: Tag widget security checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  tags:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: View/tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: View/tags/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit
